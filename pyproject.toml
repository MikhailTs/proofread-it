[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofread-it"
version = "0.0.0"
description = "Windows desktop proofreading assistant scaffold"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai>=3.8.0",
]

[project.scripts]
proofread-it = "proofread_it.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofread_it"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers", "-m", "not live and not credential_store"]
markers = [
    "credential_store: explicitly mutates one temporary Windows generic credential",
    "live: resolves the configured real credential and may make billable API requests",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "RUF",
    "S",
    "BLE",
    "DTZ",
    "LOG",
    "PT",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
