[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofread-it"
version = "0.0.0"
description = "Windows desktop proofreading assistant scaffold"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
proofread-it = "proofread_it.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofread_it"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
